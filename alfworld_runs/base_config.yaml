# Minimal ALFWorld config for the text-only AlfredTWEnv used by StateAct.
#
# Importing `alfworld` sets ALFWORLD_DATA (default: ~/.cache/alfworld), which
# is what the $ALFWORLD_DATA placeholders below expand to.
#
# Only the keys AlfredTWEnv actually reads are kept. The previous file also
# carried Thor/hybrid/controller/RL/vision settings that this benchmark never
# uses; add those sections back only if you switch env.type to
# AlfredThorEnv or AlfredHybrid.

dataset:
  data_path: '$ALFWORLD_DATA/json_2.1.1/train'
  eval_id_data_path: '$ALFWORLD_DATA/json_2.1.1/valid_seen'
  eval_ood_data_path: '$ALFWORLD_DATA/json_2.1.1/valid_unseen'
  num_train_games: -1
  num_eval_games: -1

logic:
  domain: '$ALFWORLD_DATA/logic/alfred.pddl'
  grammar: '$ALFWORLD_DATA/logic/alfred.twl2'

env:
  type: 'AlfredTWEnv'
  domain_randomization: False
  task_types: [1, 2, 3, 4, 5, 6]
  expert_type: "handcoded"
  goal_desc_human_anns_prob: 0.0

general:
  random_seed: 42
  training_method: 'dagger'

dagger:
  training:
    max_nb_steps_per_episode: 50
