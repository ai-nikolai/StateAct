# Named experiments for the alfworld benchmark.
#
# This file replaces the repeated `if [ $1 == "name" ]; then python3 <script> ...
# fi;` blocks that used to live in run_alfworld_eval.sh.
#
# Every argument list below was generated mechanically from that script: it was
# re-run with `python3` replaced by a NUL-bounded printf, so bash performed all
# variable expansion and word splitting exactly as it does for real, and the
# resulting argv was recorded verbatim. Nothing was retyped by hand.
#
# Usage:
#
#     bash run_alfworld_eval.sh <name>               # wrapper, unchanged interface
#     bash run_alfworld_eval.sh --list               # list the experiments
#     python3 stateact/run_config.py alfworld <name>           # run one
#     python3 stateact/run_config.py alfworld --list           # list them
#     python3 stateact/run_config.py alfworld <name> --dry-run # print, don't run
#
# `runner_dir` is the working directory the original script assumed - the
# benchmark's own folder, which holds prompts/, game_logs/ and results/.
#
# Upstream quirks are preserved verbatim rather than silently "fixed":
#   * alfworld 'eval_mix' contains `--trial_namen` (a typo) in one command.
#   * webshop 'webshop_local' passes `--socket` with no value, because
#     SOCKET_NAME is only assigned in a commented-out line upstream; the word
#     disappears and `--model_local` becomes its argument.
#   * some alfworld blocks end a command with a trailing-comment line
#     (`# --end_index \`), which bash treats as a comment.
#   * commands whose output the original script echoed in between are still
#     executed in the same order; only the echo chatter was dropped.

suite: alfworld
runner_dir: alfworld_runs
python: python3

experiments:

